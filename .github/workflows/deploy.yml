name: CI/CD Pipeline - Fabrica de Brinquedos

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: gilsonsouzadev
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: gilsonsouzadev/fabrica-brinquedos-api:latest

  deploy-to-oracle:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p /opt/fabrica-de-brinquedos
            cd /opt/fabrica-de-brinquedos
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              fabrica-backend:
                image: gilsonsouzadev/fabrica-brinquedos-api:latest
                container_name: fabrica-backend
                restart: always
                environment:
                  - SPRING_PROFILES_ACTIVE=supabase
                  - DB_URL=${{ secrets.DB_URL }}
                  - DB_USERNAME=${{ secrets.DB_USERNAME }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                expose:
                  - "8080"
                networks:
                  - web-network
            networks:
              web-network:
                external: true
            EOF
            docker compose pull fabrica-backend
            docker compose down fabrica-backend --remove-orphans
            docker compose up -d fabrica-backend
